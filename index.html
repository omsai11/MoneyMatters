<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Track your money spent and received using a mobile-friendly web app connected to Google Sheets."
    />
    <title>MoneyMatters</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card" aria-labelledby="app-title">
        <header class="header">
          <p class="eyebrow">Money Tracker</p>
          <h1 id="app-title">MoneyMatters</h1>
        </header>

        <form id="moneyForm" novalidate>
          <div class="field-group">
            <label for="amount">Amount (₹)</label>
            <div class="currency-wrap">
              <span class="currency-symbol">₹</span>
              <input
                id="amount"
                name="amount"
                type="number"
                min="0.01"
                step="0.01"
                inputmode="decimal"
                placeholder="2500"
                required
              />
            </div>
          </div>

          <div class="field-group">
            <label for="reason">Reason</label>
            <input
              id="reason"
              name="reason"
              type="text"
              maxlength="120"
              placeholder="e.g. Grocery, Salary, Rent"
              required
            />
          </div>

          <div class="button-group" aria-label="Save transaction type">
            <button type="submit" class="btn btn-spent" data-type="Spent">
              Spent
            </button>
            <button type="submit" class="btn btn-received" data-type="Received">
              Received
            </button>
          </div>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
